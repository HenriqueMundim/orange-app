<section>
  <form formGroup="registerProjectForm">
    <h5>Adicionar projeto</h5>
    <div class="project-info-container">
      <div class="project-image">
        <p>Selecione o conteúdo que você deseja fazer upload</p>
        <label for="file-upload" class="custom-file-upload">
          <img src="../../../assets/icons/collections.png" alt="">
          <small>Compartilhe seu talento com milhares de pessoas</small>
        </label>
        <input id="file-upload" type="file" #filePicker (change)="onImagePicked($event)"/>
      </div>
      <div class="project-info">
        <input type="text" placeholder="Título" formControlName="title">
        <input type="text" placeholder="Tags" formControlName="tags">
        <input type="text" placeholder="Link" formControlName="link">
        <textarea placeholder="Descrição"></textarea>
      </div>
    </div>
    <div class="button-container">
      <button type="submit" id="save-button">Salvar</button>
      <button type="button" (click)="bsModalRef.hide()">Cancelar</button>
    </div>
  </form>
</section>
